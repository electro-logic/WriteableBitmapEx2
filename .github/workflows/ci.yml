name: CI

on:
  push:
    branches: [ main, v2 ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore WriteableBitmapEx.sln

      - name: Build
        run: dotnet build WriteableBitmapEx.sln -c Release --no-restore

      - name: Test
        run: dotnet test WriteableBitmapEx.Tests/WriteableBitmapEx.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Pack
        run: dotnet pack WriteableBitmapEx.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
